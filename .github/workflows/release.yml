name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/release.py check --tag "${{ github.ref_name }}"
      - run: uv build --wheel --out-dir dist
      - run: uv run python scripts/release.py pack dist
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl dist/*.zip dist/*.tgz --title "${{ github.ref_name }}" --generate-notes
